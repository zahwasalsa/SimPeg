<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roadmap Karier - SimPeg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app-navbar"></div>
    <main class="container py-4">
      <div class="page-header">
        <div>
          <div class="page-eyebrow">Pengembangan Karier</div>
          <h1>Roadmap Karier</h1>
        </div>
        <button id="roadmap-add-btn" type="button" class="btn btn-primary d-none">
          <i class="bi bi-plus-lg"></i> Tambah Roadmap
        </button>
      </div>

      <div class="filter-bar">
        <div class="row g-2">
          <div class="col-sm-4 d-none" id="roadmap-filter-pegawai-wrap">
            <select id="roadmap-filter-pegawai" class="form-select" aria-label="Filter pegawai">
              <option value="">Semua Pegawai</option>
            </select>
          </div>
          <div class="col-sm-4">
            <select id="roadmap-filter-status" class="form-select" aria-label="Filter status roadmap">
              <option value="">Semua Status</option>
              <option value="in_progress">In Progress</option>
              <option value="eligible">Eligible</option>
              <option value="promoted">Promoted</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-0" id="roadmap-table"></div>
      </div>
      <div class="mt-3" id="roadmap-pagination"></div>
    </main>

    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/roadmapKarier.page.js"></script>
  </body>
</html>
