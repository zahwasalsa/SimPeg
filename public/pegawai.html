<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pegawai - SimPeg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app-navbar"></div>
    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Pegawai</h1>
        <button id="pegawai-add-btn" type="button" class="btn btn-primary d-none">+ Tambah Pegawai</button>
      </div>

      <div class="mb-3">
        <input
          type="search"
          id="pegawai-search"
          class="form-control"
          placeholder="Cari nama atau NIP..."
          aria-label="Cari pegawai"
        />
      </div>

      <div class="card">
        <div class="card-body p-0" id="pegawai-table"></div>
      </div>
      <div class="mt-3" id="pegawai-pagination"></div>
    </main>

    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/pegawai.page.js"></script>
  </body>
</html>
