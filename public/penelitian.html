<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Penelitian - SimPeg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app-navbar"></div>
    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Penelitian</h1>
        <button id="penelitian-add-btn" type="button" class="btn btn-primary d-none">
          + Tambah Penelitian
        </button>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-sm-4 d-none" id="penelitian-filter-pegawai-wrap">
          <select id="penelitian-filter-pegawai" class="form-select" aria-label="Filter pegawai">
            <option value="">Semua Pegawai</option>
          </select>
        </div>
        <div class="col-sm-4">
          <input
            id="penelitian-filter-tahun"
            type="number"
            class="form-control"
            placeholder="Filter tahun (contoh: 2026)"
          />
        </div>
      </div>

      <div class="card">
        <div class="card-body p-0" id="penelitian-table"></div>
      </div>
      <div class="mt-3" id="penelitian-pagination"></div>
    </main>

    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/penelitian.page.js"></script>
  </body>
</html>
