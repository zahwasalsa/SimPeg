<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Absensi - SimPeg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app-navbar"></div>
    <main class="container py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Absensi</h1>
        <button id="absensi-add-btn" type="button" class="btn btn-primary d-none">+ Tambah Absensi</button>
      </div>

      <div id="absensi-today-panel" class="mb-4"></div>

      <div class="row g-2 mb-3">
        <div class="col-sm-4 d-none" id="absensi-filter-pegawai-wrap">
          <select id="absensi-filter-pegawai" class="form-select" aria-label="Filter pegawai">
            <option value="">Semua Pegawai</option>
          </select>
        </div>
        <div class="col-sm-4">
          <input type="date" id="absensi-filter-tanggal" class="form-control" aria-label="Filter tanggal" />
        </div>
        <div class="col-sm-4">
          <select id="absensi-filter-status" class="form-select" aria-label="Filter status">
            <option value="">Semua Status</option>
            <option value="hadir">Hadir</option>
            <option value="izin">Izin</option>
            <option value="sakit">Sakit</option>
            <option value="alpha">Alpha</option>
            <option value="cuti">Cuti</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-0" id="absensi-table"></div>
      </div>
      <div class="mt-3" id="absensi-pagination"></div>
    </main>

    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/absensi.page.js"></script>
  </body>
</html>
