<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard - SimPeg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app-navbar"></div>
    <main class="container-fluid app-main py-4">
      <div class="page-header">
        <div>
          <div class="page-eyebrow">Ringkasan</div>
          <h1>Dashboard</h1>
        </div>
      </div>
      <div id="dashboard-welcome" class="mb-4"></div>
      <div id="dashboard-reminders" class="mb-3"></div>
      <div class="row g-3 mb-4" id="dashboard-stats"></div>
      <div class="mb-4">
        <h2 class="section-title">Aksi Cepat</h2>
        <div class="row g-2" id="dashboard-quickmenu"></div>
      </div>
      <div class="row g-3" id="dashboard-activity"></div>
      <div id="dashboard-links" class="mt-3"></div>
    </main>

    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/dashboard.page.js"></script>
  </body>
</html>
