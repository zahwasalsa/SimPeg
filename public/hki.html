<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HKI - SimPeg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app-navbar"></div>
    <main class="container-fluid app-main py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">HKI</h1>
        <button id="hki-add-btn" type="button" class="btn btn-primary d-none">+ Tambah HKI</button>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-sm-4 d-none" id="hki-filter-pegawai-wrap">
          <select id="hki-filter-pegawai" class="form-select" aria-label="Filter pegawai">
            <option value="">Semua Pegawai</option>
          </select>
        </div>
        <div class="col-sm-4">
          <select id="hki-filter-penelitian" class="form-select" aria-label="Filter penelitian">
            <option value="">Semua Penelitian</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-0" id="hki-table"></div>
      </div>
      <div class="mt-3" id="hki-pagination"></div>
    </main>

    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/hki.page.js"></script>
  </body>
</html>
