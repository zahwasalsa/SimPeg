<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dokumen - SimPeg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app-navbar"></div>
    <main class="container-fluid app-main py-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Dokumen</h1>
        <div class="d-flex gap-2">
          <button id="dokumen-kategori-btn" type="button" class="btn btn-outline-secondary d-none">
            Kelola Kategori
          </button>
          <button id="dokumen-add-btn" type="button" class="btn btn-primary d-none">+ Unggah Dokumen</button>
        </div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-sm-4 d-none" id="dokumen-filter-pegawai-wrap">
          <select id="dokumen-filter-pegawai" class="form-select" aria-label="Filter pegawai">
            <option value="">Semua Pegawai</option>
          </select>
        </div>
        <div class="col-sm-4">
          <select id="dokumen-filter-kategori" class="form-select" aria-label="Filter kategori">
            <option value="">Semua Kategori</option>
          </select>
        </div>
        <div class="col-sm-4">
          <select id="dokumen-filter-status" class="form-select" aria-label="Filter status approval">
            <option value="">Semua Status</option>
            <option value="menunggu_persetujuan">Menunggu Persetujuan</option>
            <option value="disetujui">Disetujui</option>
            <option value="ditolak">Ditolak</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-0" id="dokumen-table"></div>
      </div>
      <div class="mt-3" id="dokumen-pagination"></div>
    </main>

    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/dokumen.page.js"></script>
  </body>
</html>
