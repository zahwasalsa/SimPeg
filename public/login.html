<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - SimPeg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container d-flex align-items-center justify-content-center auth-shell">
      <div class="card shadow-sm auth-card">
        <div class="card-body p-4">
          <h1 class="h4 mb-1 text-center">SimPeg</h1>
          <p class="text-muted text-center mb-4">Sistem Pengembangan Karier dan Kinerja Pegawai</p>
          <form id="login-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input type="email" class="form-control" id="email" required autocomplete="username" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <div class="input-group">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  required
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  id="toggle-password"
                  aria-label="Tampilkan password"
                  aria-pressed="false"
                >
                  Tampilkan
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="login-submit">Masuk</button>
          </form>
        </div>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/login.page.js"></script>
  </body>
</html>
