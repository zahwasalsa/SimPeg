<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - SimPeg</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-shell d-flex align-items-center justify-content-center">
      <div class="card auth-card border-0">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <span class="auth-brand-mark mb-3"><i class="bi bi-hexagon-fill"></i></span>
            <h1 class="h4 mb-1 mt-3">Selamat Datang</h1>
            <p class="text-muted mb-0">Masuk ke SimPeg untuk melanjutkan</p>
          </div>
          <form id="login-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  required
                  autocomplete="username"
                  placeholder="nama@instansi.ac.id"
                />
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label" for="password">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  required
                  autocomplete="current-password"
                  placeholder="Kata sandi Anda"
                />
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  id="toggle-password"
                  aria-label="Tampilkan password"
                  aria-pressed="false"
                >
                  <i class="bi bi-eye" id="toggle-password-icon"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2" id="login-submit">Masuk</button>
          </form>
        </div>
      </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/pages/login.page.js"></script>
  </body>
</html>
